[project]
name = "gym-ai-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "python-dotenv==1.2.3",
    "langchain-core==1.6.6",
    "langchain-groq==1.1.3",
    "langchain-postgres==0.0.18",
    "langgraph==1.2.12",
    "langgraph-checkpoint-postgres>=3,<5",
    "psycopg[binary]==3.3.6",
    "requests==2.34.2",
]

[tool.vercel]
entrypoint = "main:app"

[dependency-groups]
ingest = [
    "langchain-community==0.4.2",
    "langchain-text-splitters==1.1.2",
    "pypdf==6.19.0",
]
