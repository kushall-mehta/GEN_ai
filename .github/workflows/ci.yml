name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  django:
    name: Django checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DB_ENGINE: sqlite
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Django dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Collect static files for tests
        run: python manage.py collectstatic --noinput

      - name: Run Django tests
        run: python manage.py test --top-level-directory .

  fastapi:
    name: FastAPI checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api_services
    env:
      GROQ_API_KEY: ci-placeholder-not-a-secret
      HF_TOKEN: ci-placeholder-not-a-secret
      LANGSMITH_TRACING: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install FastAPI dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify FastAPI application import
        run: |
          python - <<'PY'
          import sys
          from types import ModuleType
          from unittest.mock import patch      #patch → lets us temporarily replace something during the test.

          import langchain_postgres

          # Avoid the import-time vector-store setup, which requires PostgreSQL.
          retriever = ModuleType("rag.retriever")
          retriever.get_retriever = lambda category: None
          sys.modules["rag.retriever"] = retriever

          with patch.object(langchain_postgres, "PGVector"):
              from main import app

              assert app is not None
          PY

      - name: Run FastAPI tests when present
        shell: bash
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            python -m unittest discover -v
          else
            echo "No FastAPI tests found; skipping."
          fi

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Django image
        run: docker build --file backend/Dockerfile --tag gym-ai-django:ci .

      - name: Build FastAPI image
        run: docker build --file api_services/Dockerfile --tag gym-ai-api:ci .
