[project]
name = "gym-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kushal Mehta", email = "kushalmehta811@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "fastapi[standard]>=0.141.1",
    "gunicorn>=23.0.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.0",
    "langchain-postgres>=0.0.18",
    "langchain-unstructured>=1.0.1",
    "pip>=26.2.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "uv>=0.12.21",
    "whitenoise>=6.9.0",
]

[project.scripts]
gym-ai = "gym_ai:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
